services:
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: nn
    ports:
      - "9870:9870"
      - "9000:9000"
    environment:
      - CLUSTER_NAME=uteq
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - HDFS_CONF_dfs_replication=3
      - HDFS_CONF_dfs_namenode_heartbeat_recheck_interval=2000
      - HDFS_CONF_dfs_heartbeat_interval=3
    volumes:
      - nn:/hadoop/dfs/name
    networks: [hdfsnet]

  datanode1:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: dn1
    environment:
      - SERVICE_PRECONDITION=namenode:9870
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - HDFS_CONF_dfs_replication=3
    volumes:
      - dn1:/hadoop/dfs/data
    networks: [hdfsnet]

  datanode2:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: dn2
    environment:
      - SERVICE_PRECONDITION=namenode:9870
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - HDFS_CONF_dfs_replication=3
    volumes:
      - dn2:/hadoop/dfs/data
    networks: [hdfsnet]

  datanode3:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: dn3
    environment:
      - SERVICE_PRECONDITION=namenode:9870
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - HDFS_CONF_dfs_replication=3
    volumes:
      - dn3:/hadoop/dfs/data
    networks: [hdfsnet]

volumes:
  nn:
  dn1:
  dn2:
  dn3:

networks:
  hdfsnet:
    driver: bridge
